<!-- para executar comandos no django html usa-se {% 'função aqui dentro(ex: for ou include)' outro porcento}-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    {% include "recipes/partials/head.html" %}
    <title>{% block title %}{% endblock title %} Receitas </title>
</head>
<body>     <!-- Container principal para ocupar toda a largura da pagina// container externo-->
    {% include "recipes/partials/header.html"%}
    {%include "recipes/partials/search.html"%}
        <main class="main-content-container">
        <!-- comando para receber informações de qualquer pagina que seja extendida por 
         essa, fazendo com que as informações venham para cá-->
            {% block content %}{% endblock content %}
        </main>
        {%include "recipes/partials/footer.html" %}
    </body>
</html>
